<style>*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:Arial,Helvetica,sans-serif;font-size:1.0625rem;line-height:1.6;color:#1F2933;background:#fff}
.skip{position:absolute;left:-9999px;top:0;padding:.5rem 1rem;background:#1F2933;color:#fff}

.bar{height:6px;background:#0099BB}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 1.25rem}
.card{max-width:36rem;width:100%;text-align:center}
.logo{display:block;margin:0 auto 1.5rem;width:90px;height:96px}
h1{margin:0;font-size:clamp(2rem,6vw,2.75rem);line-height:1.2;letter-spacing:.01em}
.tag{margin:.5rem 0 0;font-size:1.25rem;color:#006B82;font-weight:bold}
.soon{margin:2rem 0 0;font-size:1.125rem}
.contact{margin:2rem auto 0;padding:1.25rem 1.5rem;border-top:1px solid #D9E2EC;max-width:24rem}
.contact h2{margin:0 0 .5rem;font-size:1rem;text-transform:uppercase;letter-spacing:.08em;color:#52606D}
.contact p{margin:.25rem 0}
a{color:#006B82;text-decoration:underline;text-underline-offset:.15em}
a:hover{color:#1F2933}
a:focus-visible{outline:3px solid #006B82;outline-offset:3px;border-radius:2px}
footer{padding:1.25rem;text-align:center;font-size:.9375rem;color:#52606D}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style>
